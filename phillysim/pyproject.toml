[project]
name = "phillysim"
version = "0.1.0"
description = "Measures access to health-relevant community resources across Philadelphia at the 2020 census-tract level. Descriptive access measurement only."
readme = "README.md"
license = "MIT"
license-files = ["../LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "W. Taylor Farrington" }]
# Stack is locked by ADR-0001 / ADR-0002 (roadmap/adr/). Geo I/O goes through
# pyogrio only; the `GDAL` and `fiona` PyPI packages are banned from the tree
# and tests/test_dependency_policy.py fails the build if either appears.
# r5py and its Java bridge live in the optional `routing` dependency group (EP-13,
# ADR-0008): installed locally with `uv sync --locked --group routing`, never in CI
# (importing r5py starts a JVM). psutil is core: the process-tree RSS sampler and the
# CI performance-smoke test use it.
dependencies = [
  "typer>=0.27",
  "geopandas>=1.1",
  "pyogrio>=0.13",
  "shapely>=2.1",
  "pyproj>=3.7",
  "duckdb>=1.5",
  "pyarrow>=25",
  "osmium>=4.3.1",
  "psutil>=7.2.2",
]

[project.scripts]
phillysim = "phillysim.cli:app"

[project.urls]
Repository = "https://github.com/willtfarrington/phillysim"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.14",
  "pre-commit>=4.3",
  "playwright>=1.50",
  "axe-playwright-python>=0.1.4",
]

# The routing toolchain's Python side (ADR-0008): exact pins, wheels only on Windows and
# Linux for Python 3.13 (resolved 2026-09-03 with `uv pip compile --only-binary :all:`).
# Not a default group: CI never installs it and nothing CI imports imports r5py.
routing = [
  "r5py==1.1.7",
  "jpype1==1.7.1",
  "psutil==7.2.2",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phillysim"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
