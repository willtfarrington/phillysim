# Dependabot (EP-2; roadmap/governance.md "Maintenance": uv lock + Dependabot,
# roughly quarterly review). Version-update PRs are batched monthly; security
# alerts are immediate once enabled in repository settings.
#
# The vendored `source material/` tree is reference material that is never
# built, executed, or modified (CONTRIBUTING.md). Its Ruby and npm lockfiles
# are still scanned for alerts. The two entries with
# `open-pull-requests-limit: 0` stop version-update PRs against them only:
# security-update PRs have their own fixed limit in GitHub and still open,
# and no setting in this file affects alerts. Such PRs are closed and their
# alerts dismissed as not used (owner decision, EP-16a, 2026-11-26).
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/phillysim"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
  - package-ecosystem: "bundler"
    directory: "/source material/opendataphilly-jkan-main"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
  - package-ecosystem: "npm"
    directory: "/source material/opendataphilly-jkan-main"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
